# 항공권 알림 조건. 이 파일을 고쳐서 커밋하면 바로 한 번 검색하고, 그 뒤로는 매시간 검색합니다.
# 휴대폰 GitHub 앱/웹에서 이 파일 → 연필(편집) 아이콘으로 수정하면 됩니다.
#
# 항목 설명
#   name            알림 이름 (알림 구분용, 겹치지 않게)
#   origin/destination  공항 IATA 코드 (ICN, GMP, NRT, KIX, BKK ...)
#   trip            round-trip(왕복) / one-way(편도)
#   depart_from/to  가는 날 범위 (YYYY-MM-DD)
#   nights          여행 기간 [최소박, 최대박] (왕복만)
#   max_price       최대 가격 (원, 인원 전체·수하물 요금 포함 총액)
#   adults          성인 수
#   checked_bags    위탁 수하물 개수 (요금이 가격에 포함됨)
#   carry_on_bags   기내 수하물 개수
#   max_stops       0=직항만, 1=1회 이하, 생략=상관없음
#   depart_hours    가는 편 출발 시각 범위 [시작시, 끝시] (생략 가능)
#   return_hours    오는 편 출발 시각 범위 [시작시, 끝시] (생략 가능)
#   airlines        항공사 IATA 코드 목록 (생략 가능)  예: [KE, OZ, 7C]
#   seat            economy / premium-economy / business / first
#   active          false면 검색 안 함
#
# 왕복은 (가는 날 수 × 기간 수) 만큼 검색합니다. 알림 하나당 최대 40개 조합까지만 검색하니 범위를 적당히 잡으세요.

alerts:
  - name: 도쿄 11월
    origin: ICN
    destination: NRT
    trip: round-trip
    depart_from: 2026-11-15
    depart_to: 2026-11-21
    nights: [3, 4]
    max_price: 350000
    adults: 1
    checked_bags: 1
    max_stops: 0
    depart_hours: [7, 20]
    seat: economy
    active: true
